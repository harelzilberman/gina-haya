name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9
          # v4+ refuses a "version" that differs from the root package.json
          # "packageManager" (pnpm@8.15.9, while the lockfile is v9). Read the
          # manifest from a package without that field so CI keeps pnpm 9.
          package_json_file: packages/shared/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @gina-haya/shared build

      - name: Type check shared
        run: pnpm --filter @gina-haya/shared type-check

      - name: Type check web
        run: pnpm --filter @gina-haya/web type-check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9
          # v4+ refuses a "version" that differs from the root package.json
          # "packageManager" (pnpm@8.15.9, while the lockfile is v9). Read the
          # manifest from a package without that field so CI keeps pnpm 9.
          package_json_file: packages/shared/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @gina-haya/shared build

      - name: Lint web
        run: pnpm --filter @gina-haya/web lint || true

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9
          # v4+ refuses a "version" that differs from the root package.json
          # "packageManager" (pnpm@8.15.9, while the lockfile is v9). Read the
          # manifest from a package without that field so CI keeps pnpm 9.
          package_json_file: packages/shared/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared
        run: pnpm --filter @gina-haya/shared build

      - name: Verify shared dist is up to date
        run: git diff --exit-code -- packages/shared/dist/

      - name: Build i18n
        run: pnpm --filter @gina-haya/i18n build

      - name: Build web
        run: pnpm --filter @gina-haya/web build
